[project]
name = "comfyui-hooking-server"
version = "1.0.0"
requires-python = ">=3.12.11,<3.13"
dependencies = [
    "aiohttp",
    "httpx",
    "pillow",
    "pillow-avif-plugin",
    "piexif",
    "websockets",
    "tiktoken",
    "pydantic",
    "regex",
    "requests",
    "google-genai",
    "google-cloud-aiplatform",
    "google-cloud-storage",
    "google-cloud-bigquery",
    "numpy",
    "onnxruntime-directml",
    "opencv-python",
    "mediapipe",
    "huggingface-hub",
    "lancedb>=0.34.0",
    "sentence-transformers>=5.6.1",
    "ultralytics>=8.4.95",
    "dill>=0.4.1",
    "argon2-cffi>=25.1.0",
    "modal>=1.5.3,<2",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.610.43",
    "paramiko>=5.0.0",
]

[tool.uv]
python-downloads = "automatic"
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# 루트 아래 설치된 ComfyUI / 외부 custom_nodes 의 자체 테스트가 잘못 수집되어
# 의존성 오류를 내는 것을 막는다. 프로젝트 소유 테스트는 tests/ 에만 있다.
testpaths = ["tests"]
norecursedirs = ["comfy", "custom_nodes", ".venv", "node_modules"]
