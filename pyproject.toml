[project]
name = "comfyui-hooking-server"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp",
    "httpx",
    "pillow",
    "pillow-avif-plugin",
    "piexif",
    "websockets",
    "tiktoken",
    "pydantic",
    "regex",
    "requests",
    "google-genai",
    "google-cloud-aiplatform",
    "google-cloud-storage",
    "google-cloud-bigquery",
    "numpy",
    "onnxruntime-directml",
    "opencv-python",
    "mediapipe",
    "huggingface-hub",
    "ultralytics>=8.4.95",
    "dill>=0.4.1",
]

[tool.uv]
python-downloads = "automatic"
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

